services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: endemias
      POSTGRES_USER: endemias
      POSTGRES_PASSWORD: endemias
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endemias"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npx tsx watch server/index.ts"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - api
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  api_node_modules:
  web_node_modules:
